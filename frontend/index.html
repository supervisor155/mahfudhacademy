<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Unregister any stale service workers (e.g. leftover vite-plugin-pwa) before anything else loads -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          var removed = regs.map(function(r) { return r.unregister(); });
          if (removed.length > 0) {
            Promise.all(removed).then(function() { location.reload(); });
          }
        });
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Preload Uthmanic Hafs font used in the Mushaf page -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
      href="https://fonts.gstatic.com/s/notonaskribarabic/v34/DoS8-FF2kAt3WBNgHWtRFt0OumJsUJEmaGJfAoaA.woff2" />

  </head>

  </body>
</html>
