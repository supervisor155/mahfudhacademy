<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1f3a8a" stroke="#5b74c8" stroke-width="2"/>
  
  <!-- Book shape (opened) -->
  <g transform="translate(100, 100)">
    <!-- Left page -->
    <path d="M -35 -30 L -35 40 L 0 45 L 0 -25 Z" fill="#ffffff" opacity="0.95"/>
    
    <!-- Right page -->
    <path d="M 35 -30 L 0 -25 L 0 45 L 35 40 Z" fill="#e0e7ff" opacity="0.95"/>
    
    <!-- Book spine/center line -->
    <line x1="0" y1="-25" x2="0" y2="45" stroke="#1f3a8a" stroke-width="1.5"/>
    
    <!-- Islamic pattern on left page - circles -->
    <circle cx="-20" cy="-10" r="2.5" fill="#5b74c8" opacity="0.6"/>
    <circle cx="-20" cy="5" r="2.5" fill="#5b74c8" opacity="0.6"/>
    <circle cx="-20" cy="20" r="2.5" fill="#5b74c8" opacity="0.6"/>
    
    <!-- Islamic pattern on right page - circles -->
    <circle cx="20" cy="-10" r="2.5" fill="#1f3a8a" opacity="0.7"/>
    <circle cx="20" cy="5" r="2.5" fill="#1f3a8a" opacity="0.7"/>
    <circle cx="20" cy="20" r="2.5" fill="#1f3a8a" opacity="0.7"/>
    
    <!-- Preservation shield outline on top -->
    <path d="M -15 -35 L -5 -45 L 5 -45 L 15 -35 L 15 -20 Q 0 -10 -15 -20 Z" 
          fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.9"/>
    
    <!-- Light rays for wisdom/knowledge -->
    <line x1="-8" y1="-50" x2="-8" y2="-55" stroke="#fbbf24" stroke-width="1.5" opacity="0.7"/>
    <line x1="0" y1="-52" x2="0" y2="-58" stroke="#fbbf24" stroke-width="1.5" opacity="0.7"/>
    <line x1="8" y1="-50" x2="8" y2="-55" stroke="#fbbf24" stroke-width="1.5" opacity="0.7"/>
  </g>
  
  <!-- Outer decorative ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#5b74c8" stroke-width="2" opacity="0.5" stroke-dasharray="5,5"/>
</svg>